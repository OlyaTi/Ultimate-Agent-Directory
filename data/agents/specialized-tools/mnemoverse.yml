name: Mnemoverse
url: https://github.com/mnemoverse/mcp-memory-server
description: Hosted long-term memory for AI agents over MCP. Connect with a browser sign-in on the hosted endpoint, with no API key to paste, or run the open-source npm server locally with a key; the same memory follows you across Claude Code, Cursor, VS Code, Codex and ChatGPT. Rating a recalled memory as helpful or misleading re-ranks what comes back next. Shared rooms (beta) let several agents work from one memory. The MCP server and Python SDK are open source under MIT; the memory engine is a hosted service with a free tier.
